global:
  operatorNamespace: operators
  instanceNamespace: instances
  imagePullPrefix: icr.io
  imagePullSecret: ibm-entitlement-key
  licenseAccept: true
  tetheredNamespaces: []
cpfs:
  imageRegistryNamespaceOperator: cpopen
  imageRegistryNamespaceOperand: cpopen/cpfs
  allowSubsetProjection: false
  configmapName: namespace-scope
  labels:

# Controls whether this Helm chart grants DaemonSet RBAC. When false, the
# controller can still manage DaemonSets if permission is granted elsewhere.
podRefresh:
  grantDaemonSetRBAC: true